<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>STEPZONE - Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="brand">
            <div class="logo">STEP<br>ZONE</div>
            <div>
                <h1>STEPZONE</h1>
                <p>Step Into Style.</p>
            </div>
        </div>
        <nav class="nav"><a href="home.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="checkout.html">Checkout</a>
            <a href="home.html#login">Login</a>
        </nav>
    </header>
    <main>
        <section class="section">
            <div class="title">
                <p class="eyebrow">ORDER DETAILS</p>
                <h2>Checkout</h2>
            </div>
            <form class="form-box">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required><label>Email</label>
                <input type="email" placeholder="Enter your email" required><label>Phone Number</label>
                <input type="tel" placeholder="Enter your phone number" required><label>Address</label>
                <textarea placeholder="Enter your delivery address" required></textarea>
                <label>Payment Method</label><select>
                    <option>Cash on Delivery</option>
                    <option>GCash</option>
                    <option>Bank Transfer</option>
                </select>


                <button type="submit" class="btn">Place Order</button>
            </form>
        </section>


        <section class="section">
            <div class="title">
                <p class="eyebrow">CUSTOMER FEEDBACK</p>
                <h2>Leave a Comment</h2>
            </div>
            <form class="form-box">
                <label>Your Name</label><input type="text" placeholder="Enter your name">
                <label>Your Comment</label><textarea placeholder="Write your feedback here...">
            </textarea><button type="submit" class="btn">Submit Comment</button>
            </form>
        </section>
    </main>
    <footer>
        <h2>STEPZONE</h2>
        <p>Step Into Style.</p>
        <p>© 2026 STEPZONE. All Rights Reserved.</p>
    </footer>
</body>

</html>
